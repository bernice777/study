; 교육용: 에러 관찰이 학습 포인트라 display_errors 유지 (로컬 격리 환경 전제)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; 모든 요청에 계측 키트 선(先)적재 → Trace ID 발급 + lab_query() 정의
auto_prepend_file = /opt/labkit/labkit.php

; 문자셋
default_charset = "UTF-8"

; 업로드는 SQLI 모드에서 어차피 차단하지만 방어적으로 작게 제한
file_uploads = On
upload_max_filesize = 1M
post_max_size = 2M

; 세션 쿠키 하드닝
session.cookie_httponly = 1
session.use_strict_mode = 1
