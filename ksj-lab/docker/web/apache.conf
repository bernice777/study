# /health → health.php (스펙: /health 200). Alias 는 확장자 기반 PHP 핸들러가 적용됨.
Alias /health /var/www/html/health.php

# 업로드 디렉터리에서 PHP 실행 차단 (웹셸 방지 — SQLI 범위 밖 표면 차단)
<DirectoryMatch "^/var/www/html/ksj/uploads">
    <FilesMatch "\.(php|phtml|php[0-9]|phar)$">
        Require all denied
    </FilesMatch>
    php_admin_flag engine off
</DirectoryMatch>

ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
