ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride FileInfo
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
<FilesMatch "^\.ksj-">
    Require all denied
</FilesMatch>
# Uploaded files are data; PHP caches elsewhere must remain executable.
<DirectoryMatch "^/var/www/html/(xe/files/attach|rb/files)(/|$)">
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
<Directory /var/www/html/rb/_tmp>
    Require all denied
</Directory>
