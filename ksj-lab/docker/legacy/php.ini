date.timezone = Asia/Seoul
default_charset = UTF-8
short_open_tag = On
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT
session.cookie_httponly = On
session.use_only_cookies = On
memory_limit = 128M
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 30
